<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pinterest Card</title>

    <!-- Font Awesome per le icone -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <!-- Il tuo CSS -->
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <div class="card">
      <img src="assets/images/foto.avif" alt="Foto della card" />

      <button class="save-btn">Save</button>

      <div class="bottom-bar">
        <a
          href="https://github.com/fforesta-dev"
          class="link"
          target="_blank"
          rel="noopener noreferrer"
        >
          <i class="fa-solid fa-arrow-up"></i> GitHub
        </a>
        <div class="icons">
          <button class="icon-btn" aria-label="Condividi">
            <i class="fa-solid fa-arrow-up-from-bracket"></i>
          </button>
          <button class="icon-btn" aria-label="Altre opzioni">
            <i class="fa-solid fa-ellipsis"></i>
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
